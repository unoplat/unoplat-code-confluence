version: '3'

tasks:
  launch-all-mcp:
    desc: Launch all MCP tools in background
    cmds:
      - task: launch-browser-tools-bg
      - task: launch-think-mcp-bg
      - echo "All MCP tools launched in background. Use 'task stop-all-mcp' to stop them."

  launch-browser-tools:
    desc: Launch browser tools MCP server (foreground)
    cmds:
      - npx @agentdeskai/browser-tools-server@latest

  launch-browser-tools-bg:
    desc: Launch browser tools MCP server in background
    cmds:
      - sh -c "npx @agentdeskai/browser-tools-server@latest > /tmp/browser-tools-server.log 2>&1 &"
      - echo "Browser tools server started on port 3025 (logs at /tmp/browser-tools-server.log)"

  stop-browser-tools:
    desc: Stop browser tools MCP server
    cmds:
      - sh -c "kill $(lsof -ti:3025) || echo 'Browser tools server not running'"

  launch-think-mcp:
    desc: Launch think MCP server (foreground)
    dir: /Users/jayghiya/Documents/unoplat/mcp-tools/think-mcp-server
    cmds:
      - npm install
      - npm run build
      - npm start

  launch-think-mcp-bg:
    desc: Launch think MCP server in background
    dir: /Users/jayghiya/Documents/unoplat/mcp-tools/think-mcp-server
    cmds:
      - npm install
      - npm run build
      - sh -c "npm start > /tmp/think-mcp-server.log 2>&1 &"
      - echo "Think MCP server started (logs at /tmp/think-mcp-server.log)"

  stop-think-mcp:
    desc: Stop think MCP server
    cmds:
      # Using pkill to find and kill the think-mcp-server process
      - sh -c "pkill -f 'node.*think-mcp-server' || echo 'Think MCP server not running'"

  stop-all-mcp:
    desc: Stop all MCP tools
    cmds:
      - task: stop-browser-tools
      - task: stop-think-mcp
      - echo "All MCP tools stopped"

  # GitHub Actions local testing with act
  install-act:
    desc: Install act tool for running GitHub Actions locally
    cmds:
      - |
        if ! command -v act &> /dev/null; then
          echo "Installing act via Homebrew..."
          brew install act
        else
          echo "act is already installed ($(act --version))"
        fi

  act-list-jobs:
    desc: List all GitHub Actions jobs that can be run locally
    deps: [install-act]
    cmds:
      - act --container-architecture linux/amd64 -l

  act-test-uv-projects:
    desc: Run the test-uv-projects GitHub Actions job locally using act
    deps: [install-act]
    cmds:
      - |
        echo "Running test-uv-projects job locally with act..."
        echo "Note: This requires Docker to be running and GITHUB_PAT_TOKEN to be set"
        echo ""
        # Check if GITHUB_PAT_TOKEN is set
        if [ -z "$GITHUB_PAT_TOKEN" ]; then
          echo "Warning: GITHUB_PAT_TOKEN environment variable is not set"
          echo "You may need to create a .env file with: GITHUB_PAT_TOKEN=your_token_here"
          echo "Or export it: export GITHUB_PAT_TOKEN=your_token_here"
          echo ""
        fi
        # Run the specific job with environment file support
        if [ -f ".env" ]; then
          act --container-architecture linux/amd64 -j test-uv-projects --env-file .env
        else
          act --container-architecture linux/amd64 -j test-uv-projects
        fi

  act-test-uv-projects-dry:
    desc: Dry-run the test-uv-projects job to see what would be executed
    deps: [install-act]
    cmds:
      - |
        echo "Dry-run mode for test-uv-projects job..."
        if [ -f ".env" ]; then
          act --container-architecture linux/amd64 -j test-uv-projects --env-file .env -n
        else
          act --container-architecture linux/amd64 -j test-uv-projects -n
        fi

  act-test-uv-projects-verbose:
    desc: Run the test-uv-projects job with verbose logging
    deps: [install-act]
    cmds:
      - |
        echo "Running test-uv-projects job with verbose logging..."
        if [ -f ".env" ]; then
          act --container-architecture linux/amd64 -j test-uv-projects --env-file .env -v
        else
          act --container-architecture linux/amd64 -j test-uv-projects -v
        fi

  act-setup-env:
    desc: Create a template .env file for act with required environment variables
    cmds:
      - |
        if [ ! -f ".env" ]; then
          echo "Creating .env template file..."
          cat > .env << 'EOF'
        # GitHub Personal Access Token for act
        # Generate one at: https://github.com/settings/tokens
        GITHUB_PAT_TOKEN=your_github_token_here
        
        # Add other environment variables needed for GitHub Actions here
        EOF
          echo ".env file created. Please edit it and add your actual GitHub token."
        else
          echo ".env file already exists."
        fi

  sync-mac-mini-dry:
    desc: Dry-run rsync of worktree unoplat-code-confluence.WORKTREE to the Mac Mini (usage - task sync-mac-mini-dry WORKTREE=fix-architecture-precision)
    requires:
      vars: [WORKTREE]
    cmds:
      - task: _sync-mac-mini
        vars:
          WORKTREE: "{{.WORKTREE}}"
          DRY_RUN: "1"

  sync-mac-mini:
    desc: Rsync worktree unoplat-code-confluence.WORKTREE onto the existing Mini clone and repair git worktree links (usage - task sync-mac-mini WORKTREE=fix-architecture-precision)
    requires:
      vars: [WORKTREE]
    cmds:
      - task: _sync-mac-mini
        vars:
          WORKTREE: "{{.WORKTREE}}"
          DRY_RUN: "0"

  _sync-mac-mini:
    internal: true
    requires:
      vars: [WORKTREE]
    cmds:
      - |
        set -eu
        case "{{.WORKTREE}}" in
          *[!A-Za-z0-9._-]*)
            echo "Invalid WORKTREE: {{.WORKTREE}}"
            exit 1
            ;;
        esac
        SOURCE_PARENT="$HOME/Documents/unoplat"
        MAIN_DIR="$SOURCE_PARENT/unoplat-code-confluence"
        WORKTREE_DIR="$SOURCE_PARENT/unoplat-code-confluence.{{.WORKTREE}}"
        LOCAL_ADMIN="$MAIN_DIR/.git/worktrees/unoplat-code-confluence.{{.WORKTREE}}"
        REMOTE_HOST="apekshas-mac-mini.tailff588e.ts.net"
        DEST_PARENT="/Volumes/apexa_ssd/Users/jayghiya/Documents/products"
        REMOTE_MAIN="$DEST_PARENT/unoplat-code-confluence"
        REMOTE_WORKTREE="$DEST_PARENT/unoplat-code-confluence.{{.WORKTREE}}"
        REMOTE_ADMIN="$REMOTE_MAIN/.git/worktrees/unoplat-code-confluence.{{.WORKTREE}}"
        if [ ! -d "$WORKTREE_DIR" ]; then
          echo "Worktree not found: $WORKTREE_DIR"
          exit 1
        fi
        if [ ! -d "$LOCAL_ADMIN" ]; then
          echo "Worktree git admin not found: $LOCAL_ADMIN"
          exit 1
        fi
        if [ "{{.DRY_RUN}}" = "1" ]; then
          set -- --dry-run
        else
          set --
        fi
        RSYNC_BIN="/opt/homebrew/bin/rsync"
        REMOTE_RSYNC="/opt/homebrew/bin/rsync"
        if [ ! -x "$RSYNC_BIN" ]; then
          echo "Homebrew rsync not found at $RSYNC_BIN"
          exit 1
        fi
        echo "Worktree: $WORKTREE_DIR/ -> $REMOTE_HOST:$REMOTE_WORKTREE/"
        "$RSYNC_BIN" -rlptDvh --progress --delete --delete-excluded --no-owner --no-group --no-acls --no-xattrs \
          --rsync-path="$REMOTE_RSYNC" "$@" \
          --exclude '.venv' \
          --exclude 'node_modules' \
          --exclude '.mypy_cache' \
          --exclude '.ruff_cache' \
          --exclude '.pytest_cache' \
          --exclude '.turbo' \
          --exclude '.next' \
          --exclude '.vite' \
          --exclude '.cache' \
          --exclude '__pycache__' \
          --exclude '*.egg-info' \
          --exclude '.eggs' \
          --exclude 'dist' \
          --exclude 'build' \
          --exclude 'coverage' \
          --exclude 'coverage_reports' \
          --exclude 'htmlcov' \
          --exclude '.coverage' \
          --exclude 'tmp' \
          --exclude '.tmp' \
          --exclude '.tox' \
          --exclude '.nox' \
          --exclude '.hypothesis' \
          --exclude '.ipynb_checkpoints' \
          --exclude '.DS_Store' \
          "$WORKTREE_DIR/" \
          "$REMOTE_HOST:$REMOTE_WORKTREE/"
        echo "Preparing remote worktree git admin at $REMOTE_HOST:$REMOTE_ADMIN"
        ssh "$REMOTE_HOST" "if [ -f '$REMOTE_MAIN/.git' ]; then echo 'Remote $REMOTE_MAIN is a linked worktree (.git is a file), not the main clone'; exit 1; fi; if [ ! -d '$REMOTE_MAIN/.git' ]; then echo 'Remote main clone .git not found: $REMOTE_MAIN/.git'; exit 1; fi; mkdir -p '$REMOTE_ADMIN'"
        echo "Worktree git admin: $LOCAL_ADMIN/ -> $REMOTE_HOST:$REMOTE_ADMIN/"
        "$RSYNC_BIN" -rlptDvh --progress --delete --no-owner --no-group --no-acls --no-xattrs --mkpath \
          --rsync-path="$REMOTE_RSYNC" "$@" \
          "$LOCAL_ADMIN/" \
          "$REMOTE_HOST:$REMOTE_ADMIN/"
        if [ "{{.DRY_RUN}}" = "1" ]; then
          echo "Dry-run skipped git worktree path repair on $REMOTE_WORKTREE"
          exit 0
        fi
        ssh "$REMOTE_HOST" "printf 'gitdir: %s\n' '$REMOTE_ADMIN' > '$REMOTE_WORKTREE/.git' && printf '%s\n' '$REMOTE_WORKTREE/.git' > '$REMOTE_ADMIN/gitdir' && git -C '$REMOTE_WORKTREE' rev-parse --show-toplevel && git -C '$REMOTE_WORKTREE' status -sb && git -C '$REMOTE_MAIN' worktree list"
