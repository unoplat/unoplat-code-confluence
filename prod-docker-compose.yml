# Release inputs: published tags before this schema release do not contain its
# Alembic files or readiness checks. Build all three images from one commit, then
# supply their tags here. A release commit must replace these variables with
# literal versions (promote_app_release.yaml rejects unresolved tags). Do not point
# them at older tags.
x-query-engine-image: &query-engine-image ghcr.io/unoplat/unoplat-code-confluence-query-engine:${QUERY_ENGINE_RELEASE_TAG:?Set QUERY_ENGINE_RELEASE_TAG to a release built with Alembic packaging}
# The lightweight migrator image is published with every query-engine release under
# the same tag, so the job always applies the revisions that release expects.
x-migrator-image: &migrator-image ghcr.io/unoplat/unoplat-code-confluence-query-engine-migrator:${QUERY_ENGINE_RELEASE_TAG:?Set QUERY_ENGINE_RELEASE_TAG to a release built with Alembic packaging}

services:
  postgresql:
    image: docker.io/library/postgres:17.2
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=code_confluence
    command: >
      postgres
      -c wal_level=logical
      -c listen_addresses=*
      -c max_connections=200
      -c idle_in_transaction_session_timeout=300000
      -c tcp_keepalives_idle=60
      -c tcp_keepalives_interval=10
      -c tcp_keepalives_count=6
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - temporal-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  electric:
    image: docker.io/electricsql/electric:1.4.13
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgresql:5432/code_confluence?sslmode=disable
      # Not suitable for production. Only use insecure mode in development or if you've otherwise secured the Electric API.
      # See https://electric-sql.com/docs/guides/security
      ELECTRIC_INSECURE: true
    ports:
      - "3001:3000"
    networks:
      - temporal-network
    depends_on:
      postgresql:
        condition: service_healthy

  temporal:
    depends_on:
      postgresql:
        condition: service_healthy

    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=postgresql
      # - SKIP_SCHEMA_SETUP=false
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    image: docker.io/temporalio/auto-setup:1.29.1
    networks:
      - temporal-network
    ports:
      - 7233:7233
    healthcheck:
      test: ["CMD-SHELL", "tctl cluster health | grep -i SERVING || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  temporal-admin-tools:
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    image: docker.io/temporalio/admin-tools:1.29.1-tctl-1.18.4-cli-1.5.0
    networks:
      - temporal-network
    stdin_open: true
    tty: true
  temporal-ui:
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - TEMPORAL_CSRF_COOKIE_INSECURE=True
    image: docker.io/temporalio/ui:2.43.3
    networks:
      - temporal-network
    ports:
      - 8081:8080
  # Singleton schema job. Both cutover attestations default to true.
  # Existing databases: pause/drain workflows, verify a backup and retire old writers
  # before startup; contract permanently discards legacy generated/event/error text.
  # Set either ALEMBIC_ATTEST_* variable to false to withhold that attestation.
  application-migrator:
    image: *migrator-image
    command:
      - alembic
      - -x
      - drained=${ALEMBIC_ATTEST_DRAINED:-true}
      - -x
      - discard_legacy_artifacts=${ALEMBIC_ATTEST_DISCARD_LEGACY_ARTIFACTS:-true}
      - upgrade
      - ${ALEMBIC_TARGET_REVISION:-0003_git_artifacts_contract}
    environment:
      - ALEMBIC_DATABASE_URL=postgresql://postgres:postgres@postgresql:5432/code_confluence
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - temporal-network
    restart: "no"
  code-confluence-flow-bridge:
    image: ghcr.io/unoplat/code-confluence-flow-bridge:${FLOW_BRIDGE_RELEASE_TAG:?Set FLOW_BRIDGE_RELEASE_TAG to a release built with Alembic readiness}
    environment:
      - TEMPORAL_SERVER_ADDRESS=temporal:7233
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8001,http://localhost:5173,http://127.0.0.1:3000
      - DB_HOST=postgresql
      - TEMPORAL_DEBUG=true
      - LOG_LEVEL=DEBUG
      - LOG_DIR=/tmp/logs
      - TOKEN_ENCRYPTION_KEY="0PiVvlu6HExNWkYjukuG0CAV930B4OsqXNPItAvsxhQ="
      - REPOSITORIES_BASE_PATH=/opt/unoplat/repositories
      - FRAMEWORK_DEFINITIONS_PATH=/app/framework-definitions
      - CODEBASE_PARSER_FILE_PROCESSING_CONCURRENCY=5
      - QUERY_ENGINE_BASE_URL=http://unoplat-code-confluence-query-engine:8000
      - APPLICATION_SCHEMA_STAGED_REVISION=${APPLICATION_SCHEMA_STAGED_REVISION:-}
    depends_on:
      temporal:
        condition: service_healthy
      application-migrator:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - repositories_data:/opt/unoplat/repositories
      - flow_bridge_logs:/app/logs
    networks:
      - temporal-network
    stdin_open: true
    tty: true
  unoplat-code-confluence-query-engine:
    image: *query-engine-image
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=code_confluence
      - TOKEN_ENCRYPTION_KEY=0PiVvlu6HExNWkYjukuG0CAV930B4OsqXNPItAvsxhQ=
      - LOG_DIR=/tmp/logs
      - CODEX_OPENAI_CALLBACK_PORT=1455
      - CODEX_OPENAI_CALLBACK_HOSTS=0.0.0.0
      - CODEX_OPENAI_REDIRECT_URI=http://localhost:1455/auth/callback
      - APPLICATION_SCHEMA_STAGED_REVISION=${APPLICATION_SCHEMA_STAGED_REVISION:-}
    ports:
      - "127.0.0.1:8001:8000"
      - "127.0.0.1:1455:1455"
    volumes:
      - query_engine_logs:/app/logs
      - repositories_data:/opt/unoplat/repositories
    networks:
      - temporal-network
    depends_on:
      temporal:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      application-migrator:
        condition: service_completed_successfully

  unoplat-code-confluence-frontend:
    image: ghcr.io/unoplat/unoplat-code-confluence-frontend:${FRONTEND_RELEASE_TAG:?Set FRONTEND_RELEASE_TAG to a release using the metadata and artifact APIs}
    depends_on:
      - code-confluence-flow-bridge
    ports:
      - "3000:80"
    networks:
      - temporal-network

networks:
  # Project-scoped: a second Compose project cannot resolve this stack's services.
  temporal-network:
    driver: bridge
volumes:
  postgresql_data:
    driver: local
  repositories_data:
    driver: local
  query_engine_logs:
    driver: local
  flow_bridge_logs:
    driver: local
